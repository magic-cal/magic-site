name: Deploy Nuxt site to Pages

on:
  # Deploys run only from the default branch
  push:
    branches: ['master']

  # Every pull request gets a build-and-lint check, but never a deploy
  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Read-only by default. The deploy job opts into the write scopes it needs, so
# pull request runs never hold a token that can publish to Pages.
permissions:
  contents: read

concurrency:
  # Per-ref so a pull request build cannot cancel a production deploy.
  group: pages-${{ github.ref }}
  # Superseded PR builds are worth cancelling; an in-flight deploy is not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine packager manager"
            exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: ${{ steps.detect-package-manager.outputs.manager }}
      - name: Setup Pages
        # Deploy-only: this step reads the Pages config and needs scopes that
        # pull request runs deliberately do not have.
        #
        # No static_site_generator here on purpose: that option makes the action
        # rewrite nuxt.config.js at build time, injecting router.base from the
        # Pages URL. This site is served from the custom domain in static/CNAME,
        # so the committed config (router.base '/', target 'static') is correct.
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v3
      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}
      - name: Lint
        run: ${{ steps.detect-package-manager.outputs.manager }} run lint
      - name: Static HTML export with Nuxt
        run: ${{ steps.detect-package-manager.outputs.manager }} run generate
      - name: Check the deploy artifact is complete
        run: |
          for f in dist/index.html dist/404.html dist/CNAME dist/sitemap.xml dist/robots.txt; do
            [ -s "$f" ] || { echo "::error::missing or empty: $f"; exit 1; }
          done
          echo "Prerendered pages: $(find dist -name '*.html' | wc -l)"
          echo "Sitemap URLs: $(grep -o '<loc>' dist/sitemap.xml | wc -l)"
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
